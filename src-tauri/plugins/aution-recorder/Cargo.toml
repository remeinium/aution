[package]
name = "tauri-plugin-aution-recorder"
version = "0.1.0"
authors = ["Kusal Darshana"]
description = "aution's native recorder: a microphone foreground service that keeps recording with the screen off"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.90"
links = "tauri-plugin-aution-recorder"

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
