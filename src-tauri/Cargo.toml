[package]
name = "jssayso"
version = "0.1.0"
description = "jssayso: record a voice note and it reaches your notes on its own"
authors = ["Kusal Darshana"]
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[lib]
name = "jssayso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
