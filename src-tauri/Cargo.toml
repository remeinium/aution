[package]
name = "aution"
version = "0.1.0"
description = "aution: record a voice note and it reaches your notes on its own"
authors = ["Kusal Darshana"]
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[lib]
name = "aution_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# The native recorder (Kotlin foreground service). See plugins/aution-recorder.
tauri-plugin-aution-recorder = { path = "plugins/aution-recorder" }
